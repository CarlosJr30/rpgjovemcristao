name: RPG — qualidade do código

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rpg-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Testes, lint, tipos e build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Obter código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configurar Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.16.0'
          cache: npm
      - name: Configurar npm
        run: npm install --global npm@11.13.0
      - name: Instalar dependências reproduzíveis
        run: npm ci --no-audit --no-fund
      - name: Executar testes unitários
        run: npm test -- --run
      - name: Verificar lint
        run: npm run lint
      - name: Verificar TypeScript
        run: npm run typecheck
      - name: Compilar aplicação web
        run: npm run build

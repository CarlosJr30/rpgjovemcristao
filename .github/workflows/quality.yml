name: RPG — qualidade do código

on:
  push:
    branches:
      - 'cloud/**'
      - 'preview/**'
      - 'automation/**'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - 'cloud/**'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rpg-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Testes, lint, tipos e build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Obter código da branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm

      - name: Configurar npm exigido pelo projeto
        run: npm install --global npm@11.13.0

      - name: Instalar dependências reproduzíveis
        run: npm ci --no-audit --no-fund

      - name: Executar testes unitários
        run: npm test -- --run

      - name: Verificar lint
        run: npm run lint

      - name: Verificar TypeScript
        run: npm run typecheck

      - name: Compilar aplicação web
        run: npm run build

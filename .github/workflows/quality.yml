name: RPG — qualidade do código

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rpg-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Testes, lint, tipos e build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      demo_eligible: ${{ steps.demo.outputs.eligible }}
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Obter código da branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configurar Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.16.0'
          cache: npm

      - name: Configurar npm exigido pelo projeto
        run: npm install --global npm@11.13.0

      - name: Instalar dependências reproduzíveis
        run: npm ci --no-audit --no-fund

      - name: Executar testes unitários
        run: npm test -- --run

      - name: Verificar protocolo de publicação por SHA
        run: node --test scripts/ci/*.test.mjs

      - name: Conferir isolamento da demonstração
        id: demo
        run: node scripts/ci/demo-isolation.mjs >> "$GITHUB_OUTPUT"

      - name: Verificar lint
        run: npm run lint

      - name: Verificar TypeScript
        run: npm run typecheck

      - name: Compilar aplicação web
        run: npm run build

  rsc-regression:
    name: Reprodução e contraste RSC isolados
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Obter código sem credenciais persistidas
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configurar Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.16.0'
          cache: npm
      - name: Configurar npm exigido pelo projeto
        run: npm install --global npm@11.13.0
      - name: Instalar dependências reproduzíveis
        run: npm ci --no-audit --no-fund
      - name: Instalar navegadores da versão fixada no lockfile
        run: npx --no-install playwright install chromium webkit
      - name: Preservar reprodução nativa sem o patch
        shell: pwsh
        run: |
          try {
            node scripts/next-rsc-departure-patch.mjs --restore
            if ($LASTEXITCODE -ne 0) { throw 'Native source restoration failed' }
            node tests/hosted/next-rsc-concurrency-probe.mjs --build --output build/rpg-dev-005/ci-native
            if ($LASTEXITCODE -ne 0) { throw 'Native diagnostic preconditions failed' }
          } finally {
            node scripts/next-rsc-departure-patch.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Patch application failed' }
          }
      - name: Exigir estabilidade na mesma fixture e nas regressões de lifecycle
        run: node tests/hosted/next-rsc-concurrency-probe.mjs --build --expect-stable --extended --output build/rpg-dev-005/ci-patched
      - name: Exigir estabilidade na aplicação completa com backend offline
        run: node tests/hosted/local-rsc-app-regression.mjs

  pinned-preview:
    name: Preview do SHA aprovado
    needs: [quality, rsc-regression]
    if: ${{ success() && needs.quality.outputs.demo_eligible == 'true' && github.event_name == 'push' && github.repository == 'CarlosJr30/rpgjovemcristao' && github.run_attempt == 1 && (startsWith(github.ref, 'refs/heads/preview/') || github.ref == 'refs/heads/codex/pinned-preview-ci') && vars.RPG_PINNED_PREVIEW_ENABLED == 'true' }}
    environment: preview-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Obter somente o commit que passou pelo CI
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Configurar Node.js sem instalar dependências do PR
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.16.0'
      - name: Publicar SHA imutável e aguardar READY
        id: deploy
        run: node scripts/ci/pinned-preview.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

name: Preview — verificacao antes da liberacao

on:
  push:
    branches:
      - 'preview/**'
      - 'cloud/preview-ci-gate'
      - 'cloud/preview-release-gate-007'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validar Preview
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm install --global npm@11.13.0
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --run
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  release-readiness:
    name: Qualidade aprovada para Preview
    needs: validate
    if: ${{ success() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Confirmar verificacoes
        run: |
          echo "Validacoes aprovadas para ${GITHUB_SHA}."
          echo "A publicacao depende do job gated-vercel-hook e da variavel de liberacao."

  gated-vercel-hook:
    name: Publicar Preview somente com liberacao explicita
    needs: validate
    if: ${{ success() && github.event_name == 'push' && github.run_attempt == 1 && github.ref == 'refs/heads/cloud/preview-release-gate-007' && vars.RPG_PREVIEW_HOOK_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checar se o commit aprovado ainda e o atual
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          ACTUAL=$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq '.object.sha')
          test "$ACTUAL" = "$COMMIT" || { echo "::error::Branch mudou apos os testes; deploy cancelado."; exit 1; }
      - name: Acionar gatilho Vercel da branch de teste
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_PREVIEW_DEPLOY_HOOK }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$DEPLOY_HOOK" =~ ^https://api\.vercel\.com/v1/integrations/deploy/prj_mG2ZSDaSc5i2Pz2uqKSlCzSGiVmG/[a-zA-Z0-9_-]+$ ]]; then
            echo "::error::Hook ausente ou destino diferente do projeto autorizado."
            exit 1
          fi
          # Keep the URL out of process arguments and logs. A POST is never retried:
          # a timeout may mean the deployment was already accepted by Vercel.
          RESPONSE="$RUNNER_TEMP/vercel-hook-response.json"
          if ! HTTP_STATUS=$(printf 'url = "%s"\n' "$DEPLOY_HOOK" | curl --config - --silent --output "$RESPONSE" --write-out '%{http_code}' --max-time 30 --request POST); then
            echo "::error::Resultado do hook incerto; conferir Vercel antes de outra tentativa."
            exit 1
          fi
          if [[ "$HTTP_STATUS" != '200' && "$HTTP_STATUS" != '201' ]]; then
            echo "::error::Vercel rejeitou o hook (HTTP $HTTP_STATUS)."
            exit 1
          fi
          JOB_ID=$(jq -er '.job.id | select(type == "string" and length > 0)' "$RESPONSE")
          echo "Vercel aceitou um job apos os testes. READY exige verificacao separada."
          printf 'Preview solicitada para `%s`; job Vercel `%s`. Conferir READY e SHA antes do aceite.\n' "$GITHUB_SHA" "$JOB_ID" >> "$GITHUB_STEP_SUMMARY"

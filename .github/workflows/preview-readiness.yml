name: Preview — verificacao antes da liberacao

on:
  push:
    branches:
      - 'preview/**'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validar Preview
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm install --global npm@11.13.0
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --run
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  release-readiness:
    name: Preview liberada para publicacao manual
    needs: validate
    if: ${{ success() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Confirmar verificacoes
        run: |
          echo "Validacoes aprovadas para ${GITHUB_SHA}."
          echo "Nenhum deploy foi executado."
          echo "Publicacao exige integracao Vercel configurada separadamente."

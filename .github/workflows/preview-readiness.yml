name: Preview — verificacao antes da liberacao

on:
  push:
    branches:
      - 'preview/**'
      - 'cloud/preview-ci-gate'
      - 'cloud/preview-release-gate-007'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validar Preview
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm install --global npm@11.13.0
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --run
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  release-readiness:
    name: Preview liberada para publicacao manual
    needs: validate
    if: ${{ success() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Confirmar verificacoes
        run: |
          echo "Validacoes aprovadas para ${GITHUB_SHA}."
          echo "Nenhum deploy foi executado."
          echo "Publicacao exige integracao Vercel configurada separadamente."

  gated-vercel-hook:
    name: Publicar Preview somente com liberacao explicita
    needs: validate
    if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/cloud/preview-release-gate-007' && vars.RPG_PREVIEW_HOOK_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checar se o commit aprovado ainda e o atual
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          ACTUAL=$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq '.object.sha')
          test "$ACTUAL" = "$COMMIT" || { echo "::error::Branch mudou apos os testes; deploy cancelado."; exit 1; }
      - name: Acionar gatilho Vercel da branch de teste
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_PREVIEW_DEPLOY_HOOK }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DEPLOY_HOOK" ]]; then
            echo "::error::Segredo VERCEL_PREVIEW_DEPLOY_HOOK indisponivel."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --retry 2 --max-time 30 --request POST --url "$DEPLOY_HOOK" > /dev/null
          echo "Gatilho chamado apos testes, para a branch de teste configurada no Vercel."
